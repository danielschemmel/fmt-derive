[package]
name = "fmt-derive-proc"
version = "0.1.2"
description = "A more robust and versatile derive macro for Debug and Display."
readme = "README.md"
authors = ["Daniel Schemmel <daniel@schemmel.net>"]

edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
proc-macro = true

[dependencies]
proc-macro2 = "1"
proc-macro-crate = "3"
manyhow = "0.13.0"
quote = "1"
syn = "3.0.3"

[dev-dependencies]
pretty_assertions = "1"
